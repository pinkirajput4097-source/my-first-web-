<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="cart.css">

    <title>Cart - FoodWeb</title>
</head>

<body>

    <nav>

        <div class="nav_header">

            <div class="logo nav_logo">
                <a href="index.html">
                    Food <span>Web</span>
                </a>
            </div>

            <ul class="nav_links">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="#">
                        Restaurants
                    </a>
                </li>

                <li>
                    <a href="#">
                        Login
                    </a>
                </li>

                <li>
                    <a href="cart.html">
                        Cart 🛒
                        <span id="cartCount">0</span>
                    </a>
                </li>

            </ul>

        </div>

    </nav>


    <main class="cart-page">

        <h1>Your Cart</h1>

        <div class="cart-layout">

            <div class="cart-items">

                <div id="cartItems"></div>

            </div>


            <div class="bill">

                <h2>Bill Details</h2>

                <div class="bill-row">
                    <span>Subtotal</span>
                    <span id="subtotal">₹0</span>
                </div>

                <div class="bill-row">
                    <span>Delivery Fee</span>
                    <span id="delivery">₹40</span>
                </div>

                <div class="bill-row">
                    <span>Tax</span>
                    <span id="tax">₹0</span>
                </div>

                <hr>

                <div class="bill-row total">
                    <span>Total</span>
                    <span id="total">₹0</span>
                </div>

                <button onclick="checkout()">
                    Checkout
                </button>

            </div>

        </div>

    </main>


    <script src="cart.js"></script>

</body>

</html>
